<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYTHM! Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,700;1,800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Exo 2', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }
        .osu-card {
            clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
            transition: transform 0.2s, filter 0.2s;
        }
        .osu-card:hover {
            transform: scale(1.01);
            filter: brightness(1.2);
        }
        .osu-rank {
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border-pink { border-bottom: 4px solid #f472b6; box-shadow: 0 4px 15px -5px #f472b6; }
        .neon-border-cyan { border-bottom: 4px solid #22d3ee; box-shadow: 0 4px 15px -5px #22d3ee; }
    </style>
</head>
<body class="text-white min-h-screen">

    <div class="fixed inset-0 overflow-hidden -z-10 opacity-20">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-pink-500 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-cyan-500 rounded-full blur-[150px]"></div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-12">
        <header class="flex flex-col items-center mb-16 space-y-4">
            <div class="w-32 h-32 bg-pink-500 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(244,114,182,0.4)] border-8 border-white animate-pulse">
                <span class="text-6xl font-black italic">!</span>
            </div>
            <h1 class="text-5xl font-black italic tracking-tighter">RHYTHM<span class="text-pink-500">STATS</span></h1>
        </header>

        <div class="flex justify-center mb-12">
            <div class="glass p-2 rounded-full flex w-full max-w-xl border-2 border-slate-700 focus-within:border-pink-500 transition-all">
                <input id="playerNameInput" type="text" placeholder="Search Player..." 
                    class="bg-transparent border-none px-6 py-2 w-full focus:outline-none text-xl">
                <button onclick="searchPlayer()" class="bg-pink-500 hover:bg-pink-400 px-8 py-2 rounded-full font-bold uppercase tracking-widest transition">GO</button>
            </div>
        </div>

        <div id="playerStatsResult" class="mb-12 hidden"></div>

        <div class="grid md:grid-cols-2 gap-12">
            <div>
                <h2 class="text-2xl font-black italic mb-6 uppercase tracking-wider flex items-center">
                    <span class="w-2 h-8 bg-pink-500 mr-3"></span> Global Ranking
                </h2>
                <div id="playerLeaderboard" class="space-y-4"></div>
            </div>

            <div>
                <h2 class="text-2xl font-black italic mb-6 uppercase tracking-wider flex items-center">
                    <span class="w-2 h-8 bg-cyan-500 mr-3"></span> Country Standings
                </h2>
                <div id="countryLeaderboard" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
